# Mypy configuration for ReBT-Rank (Task A2).
# Kept in a standalone file so the frozen Task A1 pyproject.toml is untouched.
# mypy_path + explicit_package_bases let mypy resolve the src-layout package
# (src/rebt_rank -> module `rebt_rank`) when pre-commit passes file paths.
[mypy]
python_version = 3.11
mypy_path = src
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# --- NumPy stub workaround ---------------------------------------------------
# The isolated pre-commit hook environment runs under Python 3.14 (the only
# interpreter available here), which forces numpy>=2.2. numpy>=2.2's type stubs
# use PEP 695 `type X = ...` syntax (Python 3.12+), which mypy rejects while we
# target Python 3.11 (python_version above). We intentionally keep the 3.11
# target and skip numpy's implementation/stubs instead: numpy is NOT part of our
# public API and we never type-check against it directly -- it is only a
# transitive dependency of pandas/pandera, which remain fully type-checked. This
# is a localized, reversible workaround for an upstream toolchain incompatibility.
follow_imports_for_stubs = true

[mypy-numpy]
follow_imports = skip

[mypy-numpy.*]
follow_imports = skip
