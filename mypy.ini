# Mypy configuration for ReBT-Rank (Task A2).
# Kept in a standalone file so the frozen Task A1 pyproject.toml is untouched.
# mypy_path + explicit_package_bases let mypy resolve the src-layout package
# (src/rebt_rank -> module `rebt_rank`) when pre-commit passes file paths.
[mypy]
python_version = 3.11
mypy_path = src
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
